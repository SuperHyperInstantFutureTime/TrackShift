<form method="post">
	<h3 id="signed-up">Thank you for signing up - you will hear from us soon!</h3>
	<h3>Sign up to get early access:</h3>

	<label>
		<span>Your name</span>
		<input name="name" required />
	</label>
	<label>
		<span>Email address</span>
		<input name="email" type="email" required />
	</label>
	<div class="actions">
		<button name="do" value="signup">Sign Up</button>
	</div>
</form>
