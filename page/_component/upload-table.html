<input type="search" id="uploadTableSearchInput" onkeyup="myFunction()" placeholder="Search uploads...">
<table id="uploadTable">
	<thead>
	<tr>
		<th>Source</th>
		<th>File name</th>
		<th>Date uploaded</th>
		<th>File Size</th>
		<th>Delete</th>
	</tr>
	</thead>
	<tbody>
	<tr data-list data-bind:class=":isProcessing processing" data-bind:id="id" data-live>
		<td class="type" data-bind:data-type="type">
			<span data-bind:text="type">Unknown</span>
		</td>
		<td class="basename">
			<h3 data-bind:text="type">Unknown</h3>
			<span data-bind:text="basename">abc.xyz</span>
		</td>
		<td class="uploaded sub-strong">
			<span data-bind:text="createdAtFormattedDate">1st Jan 1970</span>
			<strong>Uploaded</strong>
		</td>
		<td class="earnings sub-strong">
			<span data-bind:text="totalProfit" class="currency">0</span>
			<strong>Earnings</strong>
		</td>
		<td>
			<form method="post">
				<input type="hidden" name="id" data-bind:value="id" />
				<button class="button" name="do" value="delete" onclick="return confirm('Are you sure you want to delete this file?')">
					Delete <span data-bind:text="filename">file</span>
				</button>
			</form>
		</td>
	</tr>
	</tbody>
</table>

<script>
	function myFunction() {
	  // Declare variables
	  var input, filter, table, tr, td, i, txtValue;
	  input = document.getElementById("uploadTableSearchInput");
	  filter = input.value.toUpperCase();
	  table = document.getElementById("uploadTable");
	  tr = table.getElementsByTagName("tr");

	  // Loop through all table rows, and hide those who don't match the search query
	  for (i = 0; i < tr.length; i++) {
		td = tr[i].getElementsByTagName("td")[0];
		if (td) {
		  txtValue = td.textContent || td.innerText;
		  if (txtValue.toUpperCase().indexOf(filter) > -1) {
			tr[i].style.display = "";
		  } else {
			tr[i].style.display = "none";
		  }
		}
	  }
	}
</script>
